[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canonarc"
version = "0.1.0"
description = "Branchable, spoiler-free narrative memory & world-state engine for LLM games, interactive fiction, multi-agent simulations, and localization — in a single SQLite file."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "CanonArc Contributors" },
]
keywords = [
    "llm",
    "llm-memory",
    "agent-memory",
    "episodic-memory",
    "temporal-graph",
    "knowledge-graph",
    "world-state",
    "sqlite",
    "time-travel",
    "epistemic",
    "narrative",
    "interactive-fiction",
    "visual-novel",
    "rpg",
    "game-ai",
    "multi-agent",
    "simulation",
    "localization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
notebooks = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
]

[project.urls]
Homepage = "https://github.com/jovistos/canonarc"
Repository = "https://github.com/jovistos/canonarc"
Documentation = "https://github.com/jovistos/canonarc/tree/main/docs"
Issues = "https://github.com/jovistos/canonarc/issues"

[project.scripts]
canonarc = "canonarc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["rapidfuzz", "rapidfuzz.*"]
ignore_missing_imports = true
