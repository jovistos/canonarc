[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canonarc"
version = "0.1.0"
description = "Tier 1-6 Temporal Graph, Episodic Ledger, Voice Bank & Causal Time-Travel Engine for LLMs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "CanonArc Contributors" },
]
keywords = [
    "memory",
    "graph",
    "vector",
    "time-travel",
    "epistemic",
    "llm",
    "interactive-fiction",
    "visual-novel",
    "localization",
    "simulation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
notebooks = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
]

[project.urls]
Homepage = "https://github.com/jovistos/canonarc"
Repository = "https://github.com/jovistos/canonarc"
Documentation = "https://github.com/jovistos/canonarc/tree/main/docs"
Issues = "https://github.com/jovistos/canonarc/issues"

[project.scripts]
canonarc = "canonarc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
